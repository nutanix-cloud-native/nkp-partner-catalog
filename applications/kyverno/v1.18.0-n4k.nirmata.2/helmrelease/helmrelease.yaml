apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-1.18.0-n4k.nirmata.2-repo
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  url: oci://ghcr.io/nirmata/charts/kyverno
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: kyverno
      version: 3.8.2
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-1.18.0-n4k.nirmata.2-repo
        namespace: ${releaseNamespace}
      reconcileStrategy: ChartVersion
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 30
  interval: 15s
  targetNamespace: ${releaseNamespace}
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-1.18.0-n4k.nirmata.2-config-defaults
---
