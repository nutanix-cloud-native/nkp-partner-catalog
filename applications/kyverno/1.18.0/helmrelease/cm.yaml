    # Nirmata N4K images are EULA-gated; provide credentials obtained from support@nirmata.com.
    global:
      imagePullSecrets: []
      # imagePullSecrets:
      #   - name: nirmata-registry-credentials
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-config-defaults
  namespace: ${releaseNamespace}
