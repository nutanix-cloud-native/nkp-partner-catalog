overview: |-
  ## Overview

    Built around the open source high-performance NGINX web server, NGINX Ingress Controller delivers Layer 7 routing, SSL/TLS termination, HTTP/2 and gRPC support, advanced traffic splitting, and comprehensive observability across Nutanix infrastructure.

    Licensing can be added to provide enterprise-grade application delivery, traffic management, and security for Kubernetes workloads running on Nutanix Kubernetes Platform (NKP) through F5 NGINX Plus.

    ## Key Features

    - **Production-Grade Ingress Control:** Native Kubernetes Ingress API support alongside advanced Custom Resource Definitions (VirtualServer, VirtualServerRoute, TransportServer, Policy).
    - **High Performance & Low Latency:** Optimized NGINX event-driven engine handling high throughput with minimal overhead.
    - **Flexible Traffic Management:** Basic rate limiting, standard JWT validation, and IP allow/deny lists.
    - **End-to-End Observability:** Standard Prometheus metrics, OpenTelemetry distributed tracing, and detailed access logging.

    ### Enterprise support and capabilities with F5 NGINX Plus

    If using NGINX Ingress Controller with your F5 NGINX Plus image and license, you will get access to:

    - Enterprise level support and hardened releases
    - Advanced JWT and OIDC authentication
    - Zero downtime reconfiguration for backends and routing rules
    - Advanced monitor metrics with OpenTelemetry and detailed access loggin
    - WAF Integration

    Go [here](https://www.f5.com/products/get-f5/nginx-open-source-vs-nginx-one-differences-in-features) for more information and [here](https://docs.nginx.com/nginx/) for documentation on how to enable these features

    ## Deploying F5 NGINX Plus & Providing Secrets

    ### Environments which have internet access

    To deploy F5 NGINX Plus or provide custom sensitive values (like registry credentials or JWT license secrets):

    1. Create a Kubernetes Secret named `<releaseName>-custom-values` (or `imagePullSecret`) in your workspace namespace (on the workload cluster(s) where the application will be deployed) before or during installation:
        ```shell
        kubectl create secret docker-registry imagePullSecret \
          --docker-server=private-registry.nginx.com \
          --docker-username=<JWT-TOKEN> \
          --docker-password=none \
          -n <releaseNamespace>
        ```
    2. In the NKP application deployment values, update the controller configuration:
        ```yaml
        controller:
          nginxplus: true
          image:
            repository: private-registry.nginx.com/nginx-ic/nginx-plus-ingress
            tag: "5.7.0"
          imagePullSecrets:
            - name: imagePullSecret
        ```

    ### Air-gapped Environments: Quick-Start Script for Security & Infrastructure Teams

    If you're deploying the NGINX Ingress Controller in an air-gapped environment, follow the steps below to ensure all necessary images are available locally.

    You will need to use the `nkp` cli.

    #### 1. Clone the partner catalog repository

    On a workstation with internet access, clone the partner catalog repository first.

    ```shell
    git clone git@github.com:nutanix-cloud-native/nkp-partner-catalog.git
    cd nkp-partner-catalog
    ```

    #### 2. Create the air-gapped bundle

    Next, edit the `applications/nginx-ingress-controller/5.7.0/extra_images.txt` file to include any additional images required for the air-gapped deployment, then build the air-gapped bundle with the following command:

    ```shell
    nkp create catalog-bundle --apps=nginx-ingress-controller=5.7.0 --airgapped
    ```

    #### 3. Move the air-gapped bundle file to your environment

    Move the bundle file to the air-gapped environment and load it using the following commands from within your air-gapped environment.

    ```shell
    # 1. Push the bundle to the air-gapped registry
    nkp push bundle --bundle /path/to/file/nginx-ingress-controller-5.7.0-airgapped.tar --to-registry <your-registry-url>

    # 2. Create the catalog bundle
    nkp create catalog-application --url oci://<registry-url>/nkp-partner-catalog/nginx-ingress-controller --tag 5.7.0 --workspace kommander-workspace
    ```

