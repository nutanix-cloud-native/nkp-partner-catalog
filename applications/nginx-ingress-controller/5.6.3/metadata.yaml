overview: |-
  ## Overview

  Built around the open source high-performance NGINX web server, NGINX Ingress Controller delivers Layer 7 routing, SSL/TLS termination, HTTP/2 and gRPC support, advanced traffic splitting, and comprehensive observability across Nutanix infrastructure.

  Licensing can be added to provide enterprise-grade application delivery, traffic management, and security for Kubernetes workloads running on Nutanix Kubernetes Platform (NKP) through F5 NGINX Plus.

  ## Key Features

  - **Production-Grade Ingress Control:** Native Kubernetes Ingress API support alongside advanced Custom Resource Definitions (VirtualServer, VirtualServerRoute, TransportServer, Policy).
  - **High Performance & Low Latency:** Optimized NGINX event-driven engine handling high throughput with minimal overhead.
  - **Flexible Traffic Management:** Basic rate limiting, standard JWT validation, and IP allow/deny lists.
  - **End-to-End Observability:** Standard Prometheus metrics, OpenTelemetry distributed tracing, and detailed access logging.

  ### Enterprise support and capabilities with F5 NGINX Plus

  If using NGINX Ingress Controller with your F5 NGINX Plusimage and license, you will get access to:

  - Enterprise level support and hardened releases
  - Advanced JWT and OIDC authentication
  - Zero downtime reconfiguration for backends and routing rules
  - Advanced monitor metrics with OpenTelemetry and detailed access loggin
  - WAF Integration

  Go [here](https://www.f5.com/products/get-f5/nginx-open-source-vs-nginx-one-differences-in-features) for more information and [here](https://docs.nginx.com/nginx/) for documentation on how to enable these features

  ## Deploying F5 NGINX Plus & Providing Secrets

  To deploy F5 NGINX Plus or provide custom sensitive values (like registry credentials or JWT license secrets):

  1. Create a Kubernetes Secret named `<releaseName>-custom-values` (or `imagePullSecret`) in your workspace namespace before or during installation:
      ```shell
      kubectl create secret docker-registry regcred \
        --docker-server=private-registry.nginx.com \
        --docker-username=<JWT-TOKEN> \
        --docker-password=none \
        -n <releaseNamespace>
      ```
  2. In the NKP application deployment values, update the controller configuration:
      ```yaml
      controller:
        nginxplus: true
        image:
          repository: private-registry.nginx.com/nginx-ic/nginx-plus-ingress
          tag: "5.6.3"
        imagePullSecrets:
          - name: regcred
      ```

  ## Air-Gapped & Offline Environments

  For highly secure, air-gapped Nutanix environments without public internet access, NGINX Ingress Controller supports two deployment paths:

  ### Path A: Global Registry Mirroring (Recommended - Zero Override)

  If NKP is configured with cluster-wide containerd registry mirroring (e.g., Harbor or internal registry mirroring nginx/nginx-ingress), load the images into your local registry. Containerd automatically intercepts pull requests, so no values.yaml overrides are needed.

  ### Path B: Explicit Image Path Override

  If global registry mirroring is not enabled, update the image repository in your NKP custom overrides:

  ```yaml
  controller:
    image:
      repository: harbor.internal.company.com/nginx/nginx-ingress
      tag: "5.6.3"
  ```

  ### Quick-Start Script for Security & Infrastructure Teams

  On a workstation with internet access, run the following commands to mirror all required NGINX images to your internal registry:

  ```shell
  export PRIVATE_REGISTRY="harbor.internal.company.com/nginx"
  export NIC_VERSION="5.6.3"

  # 1. Pull public images
  docker pull nginx/nginx-ingress:${NIC_VERSION}

  # 2. Tag for internal registry
  docker tag nginx/nginx-ingress:${NIC_VERSION} ${PRIVATE_REGISTRY}/nginx-ingress:${NIC_VERSION}

  # 3. Save, transfer to air-gapped network, and push
  docker save ${PRIVATE_REGISTRY}/nginx-ingress:${NIC_VERSION} | gzip > nginx-ingress-${NIC_VERSION}.tar.gz

  # (On air-gapped network)
  docker load < nginx-ingress-${NIC_VERSION}.tar.gz
  docker push ${PRIVATE_REGISTRY}/nginx-ingress:${NIC_VERSION}
  ```

