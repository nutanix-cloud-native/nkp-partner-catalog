# Kubernetes versions
# (e.g. 1.33.0 - has to match versions in https://github.com/yannh/kubernetes-json-schema)
k8s_versions:
  - 1.33.0
  - 1.34.0
  - 1.35.0
  - 1.36.0

# use strict validation (reject unknown fields in resources)
strict: true

# Infisical provisions its database via the NKP CloudNativePG operator, whose
# Cluster CRD is present on NKP clusters at runtime but not known to the schema
# validator. Skip it during static validation.
skip_types:
  - postgresql.cnpg.io/v1/Cluster

substitution_vars:
  siteUrlNeedsToBeOverridden: https://infisical.example.com
