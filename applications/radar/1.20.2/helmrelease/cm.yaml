kind: ConfigMap
apiVersion: v1
metadata:
  name: ${releaseName}-1.20.2-defaults
  namespace: ${releaseNamespace}
data:
  # Source: https://github.com/skyhook-io/radar/blob/v1.20.2/deploy/helm/radar/values.yaml
  values.yaml: |
    # Served under /radar on the cluster's shared Traefik address, so no hostname is needed.
    basePath: /radar
    ingress:
      enabled: true
      className: kommander-traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        # NKP sign-in, as for the workspace's other dashboards.
        traefik.ingress.kubernetes.io/router.middlewares: ${releaseNamespace}-forwardauth@kubernetescrd
      hosts:
        - host: ""
          paths:
            - path: /radar
              pathType: Prefix
    # Each person signs in with NKP and sees only what their Kubernetes RBAC allows.
    auth:
      mode: proxy
      proxy:
        userHeader: X-Forwarded-User
        groupsHeader: Impersonate-Group
    persistence:
      enabled: true
      size: 50Gi
    timeline:
      storage: sqlite
      # Keeps the event database under the volume size, with room for the write-ahead log.
      maxSize: 40Gi
    cloud:
      # The cluster's name in NKP (2.19 and later). Empty on older NKP, where Radar picks its own name.
      clusterName: "${clusterName:=}"
