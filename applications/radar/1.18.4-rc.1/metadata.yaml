overview: |
  ## Overview

  Radar is the open-source Kubernetes UI for NKP, for humans and AI agents. kubectl answers one question at a time. Radar shows the whole cluster: how resources connect, what is failing and why, what changed and when, and the traffic between services. AI agents such as Claude Code, Codex and Cursor get the same view through Radar's built-in MCP server. It works with what NKP already runs, including Cilium Hubble, Flux, Prometheus, cert-manager, Velero and OpenCost, so there is nothing to set up. Radar is Apache 2.0 open source, built in the open on GitHub with weekly releases.

  ## Key Features

  On each cluster, free and open source:

  - **Find and fix failures:** failing workloads folded to their cause, with the resources each one affects, then the logs, events, YAML and related resources one click away.
  - **For AI agents:** a built-in MCP server gives Claude Code, Codex, Cursor and other agents Radar's view of the cluster instead of raw kubectl output.
  - **Live topology:** how workloads, Services and Ingresses connect, updated as the cluster changes.
  - **Network traffic from Hubble:** which services talk to each other, read from NKP's built-in Cilium Hubble with no extra setup.
  - **Events and change history:** Kubernetes events and resource changes, with a diff of each change, kept long past Kubernetes' one-hour event limit.
  - **Helm and Flux:** Helm release values, history and diffs between revisions, Flux sync state and drift, and Argo CD if you run it. Upgrade or roll back from the UI when you allow it.
  - **Metrics, cost and backups:** workload CPU, memory and throttling from NKP's Prometheus, cost from OpenCost, and Velero backups and restores.
  - **Certificates:** cert-manager Certificates and Issuers, and whether each one is ready.
  - **[Checks](https://radarhq.io/docs/features/cluster-audit):** best-practice checks for security, reliability and efficiency, labeled with NSA/CISA and CIS, an [upgrade impact](https://radarhq.io/docs/features/upgrade-impact) report before you move to a new Kubernetes version, and [who can do what](https://radarhq.io/docs/features/access-control) through RBAC.

  With Radar Cloud, free to start ([pricing](https://radarhq.io/pricing)):

  - **Alerts:** one alert per failure, not one per pod, sent to Slack or any webhook.
  - **AI investigations:** a root cause with evidence, run automatically on the alerts you choose or on demand.
  - **Every cluster in one place:** issues, checks, certificates and search across all your clusters, and a side-by-side diff when two clusters disagree.
  - **History:** events and changes kept long after Kubernetes deletes them, even after the pods involved are gone.
  - **Your team:** share any view by link, scoped by your Kubernetes RBAC, so nobody hands out a kubeconfig.

  ## Getting started

  **On each cluster:**

  1. In the NKP UI, open your workspace, go to **Applications**, find Radar in the partner catalog and select **Enable**. Radar needs no settings.
  2. On any cluster in the workspace, open `https://<cluster address>/radar`, using the same address as that cluster's other NKP dashboards, such as Grafana, and sign in with your NKP login.

  Nothing leaves the cluster.

  **With Radar Cloud:**

  **[Connect your NKP clusters to Radar Cloud](https://app.radarhq.io/partners/nutanix?utm_source=nutanix&utm_medium=marketplace&utm_campaign=nkp-catalog)**

  Radar Cloud has a free plan that needs no credit card, and paid plans start with a free trial. See [Radar Cloud pricing](https://radarhq.io/pricing).

  The connect page creates an enrollment key and gives you the settings to paste into the workspace configuration for Radar (see "Connecting to Radar Cloud" below). Connected clusters open an outbound connection to Radar Cloud, and you open them from Radar Cloud instead of `/radar`. No outbound access, or an air-gapped site? Run [Radar Cloud on your own infrastructure](https://radarhq.io/docs/cloud/self-hosted), [air-gapped](https://radarhq.io/docs/cloud/self-hosted/install#air-gapped-install) if needed.

  ## Security and access

  On each cluster:

  - **NKP sign-in.** `/radar` uses the same NKP login as the workspace's other dashboards. Anyone with view access to the workspace can open it.
  - **Read-only by default.** Radar doesn't read Secrets, open a shell in a pod or change Helm releases unless you turn those on.
  - **[Your Kubernetes RBAC decides](https://radarhq.io/docs/configuration/authentication).** Each person sees only the namespaces they can access, and every change runs as that person through Kubernetes impersonation.

  With Radar Cloud:

  - **[Single sign-on](https://radarhq.io/docs/cloud/sso)** with SAML or OIDC, with [identity provider groups](https://radarhq.io/docs/cloud/idp-groups) mapped to Kubernetes permissions.
  - **[Your identity provider's own tokens](https://radarhq.io/docs/cloud/self-hosted/user-tokens).** With a self-managed Radar Cloud, clusters call the Kubernetes API with each person's own SSO token, so the RBAC you already have applies unchanged.
  - **[Audit log](https://radarhq.io/docs/cloud/audit-log)** of sign-ins, membership and credential changes, pod terminal sessions and AI assistant tool calls, exportable as JSON or CSV.
  - **[Personal access tokens](https://radarhq.io/docs/cloud/personal-access-tokens)** for AI assistants and CI: per person, revocable at any time.

  ## Configuration

  Radar needs no input. To serve it on its own hostname and certificate instead of `/radar`, override:

  ```yaml
  basePath: ""
  ingress:
    hosts:
      - host: radar.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: radar-tls
        hosts:
          - radar.example.com
  ```

  ### Storage

  The event history is kept on a 50Gi volume, capped at 40Gi. How much a cluster needs depends on its size and how many events and changes it produces: a small, quiet cluster can run on 10Gi, while a large or busy one may need more than 50Gi. We recommend starting with 50Gi and adjusting as needed. To change it, override both values together, keeping `timeline.maxSize` at about 80% of the volume:

  ```yaml
  persistence:
    size: 100Gi
  timeline:
    maxSize: 80Gi
  ```

  ### Connecting to Radar Cloud

  The connect page creates an enrollment key and gives you these settings filled in, to paste into the workspace configuration for Radar:

  ```yaml
  basePath: ""
  ingress:
    enabled: false
  cloud:
    enabled: true
    hubURL: https://api.radarhq.io
    enrollment:
      key: <enrollment key>
  rbac:
    helm: true
    secrets: true
    podExec: true
    portForward: true
    metrics: true
  ```

  The key is stored with the workspace configuration, so anyone who can read that configuration can see it. On NKP 2.19 and later, each cluster appears in Radar Cloud under its name in NKP.

  All settings are in the [Radar Helm chart values](https://github.com/skyhook-io/radar/blob/v1.18.4-rc.1/deploy/helm/radar/values.yaml).

