#
# Rebuild the docs site from catalog repos + Platform OCI/git sources and
# publish to GitHub Pages via the workflow artifact.
#
# Triggers:
#   - push to main affecting docs
#   - nightly cron (resolve NKP tags, regenerate catalog + CLI, publish)
#   - manual dispatch

name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yaml'
  schedule:
    # 07:00 UTC daily
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on:
      - self-hosted-ncn-docker-medium
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out nkp-partner-catalog
        uses: actions/checkout@v7
        with:
          path: nkp-partner-catalog

      - name: Check out nkp-ai-applications-catalog
        uses: actions/checkout@v7
        with:
          repository: nutanix-cloud-native/nkp-ai-applications-catalog
          path: nkp-ai-applications-catalog
          token: ${{ secrets.CATALOG_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check out nkp-nutanix-product-catalog
        uses: actions/checkout@v7
        with:
          repository: nutanix-cloud-native/nkp-nutanix-product-catalog
          path: nkp-nutanix-product-catalog
          token: ${{ secrets.CATALOG_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install NIX
        uses: cachix/install-nix-action@v31

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          project-path: nkp-partner-catalog/docs
          enable-cache: true
          skip-nix-installation: true

      - name: Build docs
        # resolve-nkp-releases → fetch Platform git/OCI (oras via devbox) →
        # generate catalog + CLI → prepare → export → docusaurus build.
        # Sibling root is GITHUB_WORKSPACE.
        run: |
          cd nkp-partner-catalog/docs
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export NKP_CLI_FORCE_DOWNLOAD=1
          fi
          export CI=true
          devbox run -- just docs-build

      - name: Upload static files as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nkp-partner-catalog/docs/site/build

  deploy:
    needs: build
    runs-on:
      - self-hosted-ncn-docker-medium
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
