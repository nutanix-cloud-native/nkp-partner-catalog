# Shared docs source configuration (human-edited).
# Add new top-level sections here as other generators need them.
#
# Bump NKP floor / GA ceiling, portal/site URLs, and catalog list here.
# Patch tags are NOT committed — `just resolve-nkp-releases` probes
# downloads.d2iq.com from nkpVersionFloor upward into .cache/nkp-releases.json.

# ---------------------------------------------------------------------------
# site — Docusaurus site identity + footer/community links
#
# Synced to site/src/data/site-config.json at prepare. Used by docusaurus.config.js.
# portalDocsUrlTemplate placeholders: {version} (e.g. 2.19), {version_underscore}
# (e.g. 2_19). Filled from applications.maxGaNkpVersion.
# ---------------------------------------------------------------------------
site:
  title: NKP Catalog
  tagline: Documentation for NKP Catalog
  organization: nutanix-cloud-native
  project: nkp-partner-catalog
  siteUrl: https://nutanix-cloud-native.github.io
  githubRepo: https://github.com/nutanix-cloud-native/nkp-partner-catalog
  editPath: tree/main/docs/source
  portalHomeUrl: https://portal.nutanix.com
  portalDocsUrlTemplate: >-
    https://portal.nutanix.com/page/documents/details?targetId=Nutanix-Kubernetes-Platform-v{version_underscore}

# ---------------------------------------------------------------------------
# catalogs — crawled by `just generate-catalog` (after fetch-catalog-sources)
#
# Legacy entries: sibling git clone at <root>/<id>/applications/...
# Platform: kind platformHybrid expands per resolved NKP minor —
#   git kommander-applications @ v{latest} when minor < ociFromMinor
#   oci  kommander-applications-full:{v}{latest} when minor >= ociFromMinor
# ---------------------------------------------------------------------------
catalogs:
  - id: nkp-ai-applications-catalog
    name: AI Applications
    slug: ai
    repo: https://github.com/nutanix-cloud-native/nkp-ai-applications-catalog

  - id: nkp-partner-catalog
    name: Partner Catalog
    slug: partner
    repo: https://github.com/nutanix-cloud-native/nkp-partner-catalog
    nkpVersionsSource: true

  - id: nkp-nutanix-product-catalog
    name: Nutanix Products
    slug: nutanix
    repo: https://github.com/nutanix-cloud-native/nkp-nutanix-product-catalog

  - id: nkp-platform
    name: Platform
    slug: platform
    repo: https://github.com/mesosphere/kommander-applications
    sources:
      - kind: platformHybrid
        gitRepo: https://github.com/mesosphere/kommander-applications
        oci: ghcr.io/mesosphere/kommander-applications-full
        ociFromMinor: "2.19"

# ---------------------------------------------------------------------------
# applications — catalog browser NKP version filter
#
# - nkpVersionFloor: probe start for catalog/Platform + empty nkpVersionSupport
# - maxGaNkpVersion: highest MAJOR.MINOR in the public Applications dropdown;
#   resolved minors above this (or with -dev tags) are CLI-unlisted by default
# Override max at generate time: MAX_GA_NKP_VERSION=2.20 just generate-catalog
# ---------------------------------------------------------------------------
applications:
  nkpVersionFloor: "2.16"
  maxGaNkpVersion: "2.19"

# ---------------------------------------------------------------------------
# cliDocs — NKP CLI reference generation (`just generate-cli-docs`)
#
# Minors + patch tags come from resolve-nkp-releases (shared cache with Platform).
# Probe starts at the lower of cliDocs.nkpVersionFloor and applications.nkpVersionFloor.
# Platform/catalog only consume minors >= applications.nkpVersionFloor.
# - downloadUrl: tarball template ({version}, {os}, {arch})
# - defaultMinor: public default in the version pills
# - minors: optional overlays only (unlisted / label / rare latest pin)
# ---------------------------------------------------------------------------
cliDocs:
  nkpVersionFloor: "2.12"
  downloadUrl: https://downloads.d2iq.com/dkp/v{version}/nkp_v{version}_{os}_{arch}.tar.gz
  defaultMinor: "2.18"
