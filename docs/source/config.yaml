# Shared docs source configuration (human-edited).
# Add new top-level sections here as other generators need them.
#
# This is the only place to bump NKP floors, GA ceiling, known minors, CLI
# minors, or portal docs version. Scripts sync to site/src/data/*.json —
# do not hardcode versions in docs/scripts or docs/site.

# ---------------------------------------------------------------------------
# applications — catalog browser NKP version filter (`just generate-catalog`)
#
# Controls the Applications page version dropdown and empty-metadata floor.
# Synced to site/src/data/*.json at prepare time (`just _docs-prepare`).
# Do not hand-edit those JSON files.
#
# - nkpVersionFloor: empty nkpVersionSupport ⇒ this minor+ (not "any version");
#   also used as lower bound when support is upper-only (e.g. "<2.17")
# - maxGaNkpVersion: highest MAJOR.MINOR shown in the dropdown (hide pre-GA)
# - knownNkpVersions: fallback list if .release/stable.yaml is missing/unreadable
# Override max at generate time: MAX_GA_NKP_VERSION=2.20 just generate-catalog
# ---------------------------------------------------------------------------
applications:
  nkpVersionFloor: "2.16"
  maxGaNkpVersion: "2.19"
  knownNkpVersions:
    - "2.16"
    - "2.17"
    - "2.18"
    - "2.19"

# ---------------------------------------------------------------------------
# cliDocs — NKP CLI reference generation (`just generate-cli-docs`)
#
# Downloads each `latest` tag from downloads.d2iq.com and writes
# source/cli/<minor>/ from `nkp help --output markdown --tree`.
#
# - minor: URL path under /docs/cli/<minor>/ (MAJOR.MINOR)
# - latest: download tag for https://downloads.d2iq.com/dkp/v<latest>/nkp_v<latest>_…
# - unlisted: omit from the public version pills (still generated; Older menu / URL works)
# - label: optional dropdown/label override
# - defaultMinor: latest GA shown by default
#
# Nightly / workflow_dispatch may run `just update-docs-config` (best-effort)
# to rewrite `latest` when probes succeed. Prefers GA over `-dev`. Humans still
# add/remove minors, set unlisted / defaultMinor, and control maxGaNkpVersion.
#
# Support window (public pills): current GA + ~2 prior. Older minors stay
# generated but unlisted. Mark pre-GA/dev with label and/or unlisted.
# ---------------------------------------------------------------------------
cliDocs:
  defaultMinor: "2.18"
  minors:
    - minor: "2.12"
      latest: "2.12.2"

    - minor: "2.13"
      latest: "2.13.3"

    - minor: "2.14"
      latest: "2.14.3"

    - minor: "2.15"
      latest: "2.15.2"

    - minor: "2.16"
      latest: "2.16.1"

    - minor: "2.17"
      latest: "2.17.1"

    - minor: "2.18"
      latest: "2.18.0"

    - minor: "2.19"
      latest: "2.19.0-dev"
      label: "2.19 (dev)"
      unlisted: true

    - minor: "2.20"
      latest: "2.20.0-dev"
      label: "2.20 (dev)"
      unlisted: true
